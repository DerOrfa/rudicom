name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  #PYO3_PRINT_CONFIG: 1

jobs:
  build:
    strategy:
      # Continue running other matrix jobs even if one fails
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        architecture: ['x64', 'arm64']
        # Exclude combinations that don't exist or aren't supported
        exclude:
          # Windows ARM64 runners are not widely available
          - os: windows-latest
            architecture: arm64


    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
      - name: Run tests
        run: cargo test
      - name: Build binaries in "release" mode
        run: cargo build -r
      - name: Upload Unix
        if: matrix.config.os != 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rudicom-${{ matrix.os }}-${{ matrix.architecture }}
          path: target/release/rudicom
          archive: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Windows
        if: matrix.config.os == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: rudicom-${{ matrix.os }}-${{ matrix.architecture }}
          path: target/release/rudicom.exe
          archive: false
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
